<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <!-- STUDENT: Replace PUT YOUR NAME HERE with your name -->
  <title>PUT YOUR NAME HERE</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Raleway">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

  <style>
    body, h1 {
      font-family: "Raleway", Arial, sans-serif;
    }

    h1 {
      letter-spacing: 6px;
    }

    .gallery {
      max-width: 1000px;
      margin-left: auto;
      margin-right: auto;
    }

    .gallery img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* Make navigation comfortable on smaller screens */
    .student-nav {
      display: inline-flex;
      flex-wrap: wrap;
      justify-content: center;
    }
    @media (max-width: 600px) {

      header.w3-panel {
        padding: 64px 16px !important;
      }

      .student-nav {
        display: flex !important;
        width: 100%;
      }

      .student-nav a {
        flex: 1 1 50%;
      }
    }
  </style>
</head>

<body>

<!-- =========================================================
     AVMP-150 / AVMP-290 STUDENT PORTFOLIO

     You do NOT need to learn HTML before completing this page.

     Look for the CAPITALIZED instructions and replace them
     with your own information.

     IMPORTANT: Keep this file named exactly index.html
     ========================================================= -->


<div class="w3-content" style="max-width:1500px">

  <!-- =======================================================
       HEADER

       Replace:
       PUT YOUR CAREER JOB HERE
       PUT YOUR NAME HERE

       Example:
       VIDEO EDITOR
       JANE SMITH
       ======================================================= -->

  <header class="w3-panel w3-center w3-opacity" style="padding:128px 16px">

    <h1 class="w3-xlarge">PUT YOUR CAREER JOB HERE</h1>

    <h1>PUT YOUR NAME HERE</h1>


    <!-- =====================================================
         NAVIGATION MENU

         Replace the CAPITALIZED instructions inside the links.
         Keep the quotation marks.
         ===================================================== -->

    <div class="w3-padding-32">

      <nav class="w3-flex w3-border student-nav">

        <!-- STUDENT: Replace PUT YOUR NAME HERE with your name -->
        <a href="index.html" class="w3-button">
          PUT YOUR NAME HERE
        </a>


        <!--
          PORTFOLIO:
          Replace ADD A LINK TO YOUR YOUTUBE PAGE
          with the complete address of your YouTube page.

          Example:
          https://www.youtube.com/@yourname
        -->
        <a href="ADD A LINK TO YOUR YOUTUBE PAGE"
           target="_blank"
           rel="noopener"
           class="w3-button w3-light-grey">
          Portfolio
        </a>


        <!--
          RESUME:
          Upload your resume PDF to the SAME GitHub repository.

          Replace ADD THE LINK TO YOUR RESUME PDF
          with the exact filename of your PDF.

          Example:
          jane-smith-resume.pdf
        -->
        <a href="ADD THE LINK TO YOUR RESUME PDF"
           target="_blank"
           rel="noopener"
           class="w3-button">
          Resume
        </a>


        <!--
          VIMEO:
          Replace ADD A LINK TO YOUR VIMEO PAGE
          with the complete address of your Vimeo page.

          Example:
          https://vimeo.com/yourname
        -->
        <a href="ADD A LINK TO YOUR VIMEO PAGE"
           target="_blank"
           rel="noopener"
           class="w3-button">
          Vimeo
        </a>

      </nav>

    </div>

  </header>


  <!-- =======================================================
       PHOTO GALLERY

       STEP 1:
       Choose ONE favorite JPG, JPEG, or PNG image.

       STEP 2:
       Upload that image to the SAME GitHub repository
       as index.html.

       STEP 3:
       Find PLACE YOUR FAVORITE PICTURE HERE below.

       STEP 4:
       Replace it with the EXACT filename you uploaded.

       EXAMPLE:

       If your image is called:
       my-favorite-photo.jpg

       Change:

       src="PLACE YOUR FAVORITE PICTURE HERE"

       to:

       src="my-favorite-photo.jpg"

       IMPORTANT:
       Capitalization and spelling matter.

       photo.jpg and Photo.jpg may be treated as different files.
       ======================================================= -->

  <div class="gallery" style="margin-bottom:128px">

    <!-- ================= YOUR PICTURE ====================== -->

    <img src="PLACE YOUR FAVORITE PICTURE HERE"
         alt="PUT A SHORT DESCRIPTION OF YOUR PICTURE HERE">

  </div>

</div>


<!-- =========================================================
     FOOTER
     ========================================================= -->

<footer class="w3-container w3-padding-64 w3-light-grey w3-center w3-large">

  <!-- =========================================================
       OPTIONAL SOCIAL MEDIA LINKS

       Replace the CAPITALIZED placeholder inside href="..."
       with the COMPLETE web address for any social media page
       you want to include.

       EXAMPLE:
       href="https://www.instagram.com/yourname"

       If you do not use one of these services, you may leave
       that icon alone for now.
       ========================================================= -->

  <!-- YOUTUBE: Replace ADD YOUR YOUTUBE LINK HERE -->
  <a href="ADD YOUR YOUTUBE LINK HERE"
     target="_blank"
     rel="noopener"
     aria-label="YouTube"
     class="w3-hover-opacity"
     style="text-decoration:none;">
    <i class="fa fa-youtube-play" aria-hidden="true"></i>
  </a>

  <!-- VIMEO: Replace ADD YOUR VIMEO LINK HERE -->
  <a href="ADD YOUR VIMEO LINK HERE"
     target="_blank"
     rel="noopener"
     aria-label="Vimeo"
     class="w3-hover-opacity"
     style="text-decoration:none;">
    <i class="fa fa-vimeo" aria-hidden="true"></i>
  </a>

  <!-- INSTAGRAM: Replace ADD YOUR INSTAGRAM LINK HERE -->
  <a href="ADD YOUR INSTAGRAM LINK HERE"
     target="_blank"
     rel="noopener"
     aria-label="Instagram"
     class="w3-hover-opacity"
     style="text-decoration:none;">
    <i class="fa fa-instagram" aria-hidden="true"></i>
  </a>

  <!-- LINKEDIN: Replace ADD YOUR LINKEDIN LINK HERE -->
  <a href="ADD YOUR LINKEDIN LINK HERE"
     target="_blank"
     rel="noopener"
     aria-label="LinkedIn"
     class="w3-hover-opacity"
     style="text-decoration:none;">
    <i class="fa fa-linkedin" aria-hidden="true"></i>
  </a>

  <p>AVMP Student Portfolio</p>

  <p>
    Built with
    <a href="https://www.w3schools.com/w3css/default.asp"
       target="_blank"
       rel="noopener"
       class="w3-hover-text-green">W3.CSS</a>
  </p>

</footer>

</body>
</html>
